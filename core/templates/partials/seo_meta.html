{% load static %}
<meta name="description" content="{{ seo_description }}" />
<link rel="canonical" href="{{ site_base_url }}{{ seo_path }}" />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Gabsweb CashFlow" />
<meta property="og:title" content="{{ seo_title }}" />
<meta property="og:description" content="{{ seo_description }}" />
<meta property="og:url" content="{{ site_base_url }}{{ seo_path }}" />
<meta property="og:image" content="{{ site_base_url }}{% static 'assets/images/gabsweb-cashflow-logo.png' %}" />
<meta property="og:image:alt" content="Gabsweb CashFlow logo" />
<meta property="og:locale" content="en_NG" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ seo_title }}" />
<meta name="twitter:description" content="{{ seo_description }}" />
<meta name="twitter:image" content="{{ site_base_url }}{% static 'assets/images/gabsweb-cashflow-logo.png' %}" />
<meta name="twitter:image:alt" content="Gabsweb CashFlow logo" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ site_base_url }}/#organization",
      "name": "Gabsweb CashFlow",
      "url": "{{ site_base_url }}/",
      "logo": "{{ site_base_url }}{% static 'assets/images/gabsweb-cashflow-logo.png' %}",
      "parentOrganization": {
        "@type": "Organization",
        "name": "Gabsweb",
        "url": "https://gabsweb.com.ng/"
      }
    },
    {
      "@type": "WebSite",
      "@id": "{{ site_base_url }}/#website",
      "url": "{{ site_base_url }}/",
      "name": "Gabsweb CashFlow",
      "description": "A personal finance application for tracking accounts, transactions, budgets, savings and goals.",
      "inLanguage": "en-NG",
      "publisher": {
        "@id": "{{ site_base_url }}/#organization"
      }
    },
    {
      "@type": "WebPage",
      "@id": "{{ site_base_url }}{{ seo_path }}#webpage",
      "url": "{{ site_base_url }}{{ seo_path }}",
      "name": "{{ seo_title|escapejs }}",
      "description": "{{ seo_description|escapejs }}",
      "isPartOf": {
        "@id": "{{ site_base_url }}/#website"
      },
      "inLanguage": "en-NG"
    }
  ]
}
</script>
