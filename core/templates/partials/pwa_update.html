<div id="pwa-update-banner" class="pwa-update" role="status" aria-live="polite" hidden>
  <span class="pwa-update-icon"><i data-lucide="refresh-cw" aria-hidden="true"></i></span>
  <span class="pwa-update-copy">
    <strong>A new version is ready</strong>
    <span>Refresh when you are ready to update.</span>
  </span>
  <button type="button" class="pwa-update-action" id="pwa-update-action">Refresh</button>
  <button
    type="button"
    class="pwa-update-dismiss"
    id="pwa-update-dismiss"
    aria-label="Dismiss update notice"
  >
    <i data-lucide="x" aria-hidden="true"></i>
  </button>
</div>

<div id="pwa-toast" class="pwa-toast" role="status" aria-live="polite" hidden></div>
