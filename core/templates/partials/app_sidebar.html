{% load static %}
<aside id="sidebar" class="sidebar w-64 sm:w-72 h-screen fixed top-0 left-0 z-[110] bg-bg border-r border-border flex flex-col max-xl:left-[-100%] max-xl:invisible max-xl:opacity-0">
  <div class="p-3 sm:p-6 border-b border-border flex-shrink-0">
    <div class="flex justify-between">
      <a href="{% url 'core:index' %}" class="flex items-center gap-3 mb-3 sm:mb-6 cursor-pointer">
        <div class="flex items-center justify-center">
          <img src="{% static 'assets/images/gabsweb-cashflow-logo.png' %}" alt="Gabsweb CashFlow Logo" class="brand-logo w-10 h-10 sm:w-12 sm:h-12 rounded-2xl" />
        </div>
        <div>
          <h1 class="text-sm font-bold text-text">Gabsweb CashFlow</h1>
          <p class="text-xs text-muted font-medium">Smart Finance</p>
        </div>
      </a>

      <button id="close-sidebar" class="p-2 rounded-xl hover:bg-bgbg block xl:hidden transition-transform duration-300">
        <i data-lucide="x" class="w-5 h-5 text-text"></i>
      </button>
    </div>

    <div class="content-box glass p-4 border-border border rounded-2xl">
      <div class="flex items-center gap-2 mb-2">
        <span class="text-[10px] sm:text-xs font-semibold text-muted uppercase tracking-wider">Total Balance</span>
        <button type="button" class="sidebar-balance-toggle ml-auto" data-balance-visibility-toggle aria-pressed="false" aria-label="Hide balances" title="Hide balances">
          <i data-lucide="eye" class="w-3.5 h-3.5"></i>
        </button>
        <div class="live-dot"></div>
      </div>
      <h5 id="sidebar-total-balance" class="text-xl sm:text-2xl font-bold text-gradient mb-1">—</h5>
      <p id="sidebar-balance-note" class="text-[10px] sm:text-xs text-muted whitespace-nowrap opacity-80 flex gap-2 mt-1">Loading finances…</p>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto p-2 sm:p-4 custom-scrollbar">
    <div class="space-y-1">
      <a href="{% url 'core:index' %}" class="nav-item">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span>Dashboard</span>
      </a>
      <a href="{% url 'core:planner' %}" class="nav-item">
        <i data-lucide="calendar-check" class="w-5 h-5"></i>
        <span>Planner</span>
      </a>
      <a href="{% url 'core:transaction' %}" class="nav-item">
        <i data-lucide="arrow-right-left" class="w-5 h-5"></i>
        <span>My Finances</span>
      </a>
      <a href="{% url 'core:budgets' %}" class="nav-item">
        <i data-lucide="wallet-cards" class="w-5 h-5"></i>
        <span>Budget &amp; Money Allocation</span>
      </a>
      <a href="{% url 'core:savings' %}" class="nav-item">
        <i data-lucide="coins" class="w-5 h-5"></i>
        <span>Savings</span>
      </a>
      <a href="{% url 'core:goals' %}" class="nav-item">
        <i data-lucide="target" class="w-5 h-5"></i>
        <span>Goals</span>
      </a>
      <a href="{% url 'core:work_schedule' %}" class="nav-item">
        <i data-lucide="calendar-clock" class="w-5 h-5"></i>
        <span>Work Schedule</span>
      </a>
      <a href="{% url 'core:insights' %}" class="nav-item">
        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        <span>Reports &amp; Insights</span>
      </a>
    </div>

    <div class="mt-6 pt-6 border-t border-border space-y-1">
      <a href="{% url 'core:settings' %}" class="nav-item">
        <i data-lucide="settings" class="w-5 h-5"></i>
        <span>Settings</span>
      </a>
    </div>
  </nav>

  <div class="p-4 border-t border-border flex-shrink-0 relative">
    <div id="user-button" class="flex items-center gap-3 rounded-2xl hover:bg-opacity-50 cursor-pointer">
      <div class="w-10 h-10 sm:w-12 sm:h-12 border-2 border-blue-700 rounded-full flex items-center justify-center text-text font-bold">
        <img id="sidebar-profile-avatar-image" class="w-8 h-8 md:w-10 md:h-10 rounded-full flex justify-center items-center object-cover" src="{% if user.effective_profile_image_url_versioned %}{{ user.effective_profile_image_url_versioned }}{% else %}{% static 'assets/images/profiles/gabsweb-default-avatar.png' %}{% endif %}" alt="profile Image" />
      </div>
      <div class="flex-1 min-w-0">
        <h2 id="sidebar-user-name" class="text-sm font-semibold text-text truncate">{{ user.get_two_part_name }}</h2>
        <p class="text-xs text-muted truncate">Personal account</p>
      </div>
      <i data-lucide="chevron-down" class="w-4 h-4 text-muted transition-transform duration-200" id="dropdown-arrow"></i>
    </div>

    <div id="user-dropdown" class="absolute left-2 bottom-full mb-2 w-full max-w-[300px] md:max-w-[200px] bg-bg border border-border rounded-xl shadow-lg hidden z-500">
      <ul class="py-2">
        <li>
          <a href="{% url 'core:settings' %}" class="block px-4 py-2 text-sm text-text hover:bg-bg">Profile</a>
        </li>
        <li id="pwa-install-menu-row" hidden>
          <button type="button" id="pwa-install-menu-item" class="block w-full bg-transparent border-0 cursor-pointer text-left px-4 py-2 text-sm text-text hover:bg-bg">
            <i data-lucide="download" class="inline-block w-4 h-4 mr-2 align-text-bottom"></i>Install app
          </button>
        </li>
        <li>
          <button type="submit" form="logout-form" id="logOut" class="block w-full bg-transparent border-0 cursor-pointer text-left px-4 py-2 text-sm text-text hover:bg-bg">Logout</button>
        </li>
      </ul>
    </div>

    <form id="logout-form" method="post" action="{% url 'core:logout' %}">
      {% csrf_token %}
    </form>
  </div>
</aside>
